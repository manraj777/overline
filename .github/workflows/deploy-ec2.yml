name: Deploy backend to EC2

# Triggers:
#   - automatic on push to main when backend / shared / deploy paths change
#   - manual via the Actions tab (workflow_dispatch) with optional --with-prisma
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'deploy/**'
      - '.github/workflows/deploy-ec2.yml'
  workflow_dispatch:
    inputs:
      with_prisma:
        description: 'Run prisma generate + db push during deploy'
        type: boolean
        default: false
      branch:
        description: 'Branch to deploy (default: main)'
        type: string
        default: 'main'

concurrency:
  # One deploy at a time — newer pushes cancel queued runs but never abort an
  # in-flight deploy (so EC2 never ends up half-built).
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy via deploy.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (for sanity check only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify deploy.sh exists in repo
        run: test -x deploy/deploy.sh

      - name: Run deploy.sh on EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          # 10-minute hard cap for the whole deploy.
          command_timeout: 10m
          script_stop: true
          envs: WITH_PRISMA,DEPLOY_BRANCH
          script: |
            set -euo pipefail

            REPO_DIR="${EC2_REPO_DIR:-$HOME/overline}"
            cd "$REPO_DIR"

            FLAGS=()
            if [ "${WITH_PRISMA:-false}" = "true" ]; then
              FLAGS+=(--with-prisma)
            fi
            if [ -n "${DEPLOY_BRANCH:-}" ] && [ "$DEPLOY_BRANCH" != "main" ]; then
              FLAGS+=(--branch "$DEPLOY_BRANCH")
            fi

            echo "::group::Running deploy.sh ${FLAGS[*]:-}"
            ./deploy/deploy.sh "${FLAGS[@]}" </dev/null
            echo "::endgroup::"
        env:
          WITH_PRISMA: ${{ inputs.with_prisma || 'false' }}
          DEPLOY_BRANCH: ${{ inputs.branch || 'main' }}

      - name: Smoke test /api/v1/health
        if: success()
        run: |
          set -e
          URL="${{ secrets.HEALTHCHECK_URL }}"
          if [ -z "$URL" ]; then
            echo "HEALTHCHECK_URL secret not set; skipping smoke test."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Health check failed after 5 attempts." >&2
          exit 1
