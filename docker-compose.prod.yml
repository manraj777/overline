version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: overline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: overline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PASSWORD_REQUIRED}
      POSTGRES_DB: overline
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U overline -d overline']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - overline-network

  redis:
    image: redis:7-alpine
    container_name: overline-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - overline-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: overline-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://overline:${POSTGRES_PASSWORD:?PASSWORD_REQUIRED}@postgres:5432/overline?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_REQUIRED}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET_REQUIRED}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID_REQUIRED}
      RAZORPAY_SECRET: ${RAZORPAY_SECRET:?RAZORPAY_SECRET_REQUIRED}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - overline-network

  user-web:
    build:
      context: .
      dockerfile: apps/user-web/Dockerfile
    container_name: overline-user-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001/api/v1
    depends_on:
      - backend
    networks:
      - overline-network

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: overline-admin-web
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001/api/v1
    depends_on:
      - backend
    networks:
      - overline-network

  # Optional: Redis Commander for debugging Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: overline-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis
    networks:
      - overline-network
    profiles:
      - debug

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: overline-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@overline.in
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '8082:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - overline-network
    profiles:
      - debug

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: overline-n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      - N8N_HOST=n8n.overline.in
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.overline.in/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - overline-network

networks:
  overline-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  n8n_data:
